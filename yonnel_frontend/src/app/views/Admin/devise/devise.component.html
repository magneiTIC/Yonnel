<app-sideheader></app-sideheader>
<div class="app app-wrapper">
    <div class="app-content pt-3 p-md-3 p-lg-4">
        <div class="container-xl">
            <h1 class="app-page-title"></h1>
            <div class="row gy-4">
                <div class="col-5">
                    <div class="card">
                        <div class="card-header text-white bg-success">Ajout Devise</div>
                        <div class="card-body">
                            <form [formGroup]="deviseForm" (ngSubmit)="onSubmitDevise()">
                                <div class="form-group mb-3">
                                    <input formControlName="nom" type="text" class="form-control" 
                                        placeholder="Nom">
                                </div>
                                <div class="form-group mb-3">
                                    <input formControlName="codeISO3" type="text" class="form-control" 
                                        placeholder="Code Iso">
                                </div>
                               
                                <div class="row">
                                    <div class="col-3">Symbole</div>
                                    <div class="col-5">
                                        <div class="form-group mb-3">
                                            <div class="form-check form-check-inline">
                                                <label class="form-check-label" for="inlineRadio1">Oui</label>
                                                <input formControlName="symbole" class="form-check-input" type="radio" name="inlineRadioOptions"
                                                    id="inlineRadio1" value="true">
                                            </div>
                                            <div class="form-check form-check-inline">
                                                <label class="form-check-label" for="inlineRadio2">Non</label>
                                                <input formControlName="symbole" class="form-check-input" type="radio" name="inlineRadioOptions"
                                                    id="inlineRadio2" value="false">
                                            </div>
                                        </div>
                                    </div>
                                </div>                 
                                <button type="submit" class="btn btn-primary text-white mb-3">Enregistrer</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<app-footer></app-footer>
