<body class="app">
    <app-sideheader></app-sideheader>
    <div class="app-wrapper">
        <div class="app-content pt-3 p-md-3 p-lg-4">
            <div class="container-xl">
                <div class="row g-3 mb-4 align-items-center justify-content-between"></div>
                <h2 class="mb-3">Liste des agences</h2>
                <div class="app-card app-card-orders-table shadow-sm mb-5">
                    <table class="table table-bordered app-table-hover">
                        <thead>
                            <tr>
                                <th scope="col">NOM</th>
                                <th scope="col">BALANCE</th>
                                <th scope="col">STATUT</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody *ngFor="let agence of agences">
                            <tr>
                                <td> {{agence.nom }}</td>
                                <td> {{agence.balance}}</td>
                                <td> {{agence.statut}}</td>
                            </tr>                            
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
