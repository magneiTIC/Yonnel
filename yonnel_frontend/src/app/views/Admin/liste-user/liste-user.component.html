<body class="app">
    <app-sideheader></app-sideheader>
    <div class="app-wrapper">
        <div class="app-content pt-3 p-md-3 p-lg-4">
            <div class="container-xl">
                <div class="row g-3 mb-4 align-items-center justify-content-between"></div>
                <div class="card">
                    <div class="card-header bg-success">
                            <h5>Liste des utilisateurs</h5>
                            </div>
                        <div class="card-body">
                            <div class="tab-content" id="orders-table-tab-content">
                                <div class="tab-pane fade show active" id="orders-all" role="tabpanel"
                                    aria-labelledby="orders-all-tab">
                                    <div class="app-card app-card-orders-table shadow-sm mb-5">
                                <div class="table-responsive">
                                    <table class="table app-table-hover mb-0 text-left">
                        <thead>
                            <tr>
                           
                                <th class="cell">LOGIN</th>
                                <th class="cell">PASSWORD</th>
                            </tr>
                        </thead>
                       <tbody *ngFor="let user of users">
                        <tr>
                            <td class="cell"> {{user.login}}</td>
                            <td class="cell"> {{user.SousAgence.nom}}</td>
                        </tr>                            
                    </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
