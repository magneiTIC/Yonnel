<app-sideheader></app-sideheader>
<div class="app app-wrapper">
  <div class="app-content pt-3 p-md-3 p-lg-4">
    <div class="container-xl">
      <h1 class="app-page-title">Ajout user</h1>
      <div class="row gy-4">
        <div class="col-12 col-lg-6">
          <form>
            <div class="form-group mb-3">
              <input formControlName="login" type="login" class="form-control" placeholder="Login">
            </div>
            <div class="form-group mb-3">
              <input formControlName="password" type="text" class="form-control" placeholder="Password">
            </div>
            <div class="form-group mb-3">
              <select class="form-select" aria-label="Default select example">
                <option selected>Sélectionner</option>
                <option value="1">Sonatel</option>
              </select>
            </div>
            <div class="row">
              <div class="col-3">Statut</div>
              <div class="col-5">
                  <div class="form-group mb-3">
                      <div class="form-check form-check-inline">
                          <label class="form-check-label" for="inlineRadio1">Admin</label>
                          <input class="form-check-input" type="radio" name="inlineRadioOptions"
                              id="inlineRadio1" value="option1">
                      </div>
                      <div class="form-check form-check-inline">
                          <label class="form-check-label" for="inlineRadio2">User</label>
                          <input class="form-check-input" type="radio" name="inlineRadioOptions"
                              id="inlineRadio2" value="option2">
                      </div>
                  </div>
              </div>
          </div>
            <button type="submit" class="btn btn-primary">Enregistrer</button>
          </form>
          <!--//form-->
        </div>
      </div>
    </div>
  </div>



</div>
