<app-sideheader></app-sideheader>
<div class="app app-wrapper">
    <div class="app-content pt-3 p-md-3 p-lg-4">
        <div class="container-xl">
            <h1 class="app-page-title"></h1>
            <div class="row gy-4">
                <div class="col-5">
                    <div class="card">
                        <div class="card-header text-white bg-success">Ajout Pays</div>
                        <div class="card-body">
                            <form [formGroup]="paysForm" (ngSubmit)="onSubmitPays()">
                                <div class="form-group mb-3">
                                    <input formControlName="nom" type="text" class="form-control" id="nom"
                                        placeholder="Nom">
                                </div>
                                <div class="form-group mb-3">
                                    <input formControlName="codeISO1" type="text" class="form-control" id="codeISO1"
                                        placeholder="Code ISO">
                                </div>
                                <div class="form-group mb-3">
                                    <select  formControlName="DeviseId"  id="DeviseId" class="form-control">
                                        <option value="" selected>Choisir une devise...</option>
                                        <option *ngFor="let devise of devises"  [value]="devise.id" >{{devise.nom}}</option>
                                    </select>
                                </div>
                                
                                <button type="submit" class="btn btn-primary text-white mb-3">Enregistrer</button>

                            </form>
                        </div>
                    </div>

                </div>
